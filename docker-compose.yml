version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: finance-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: finance-backend

    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - postgres

    env_file:
      - .env

volumes:
  postgres_data: